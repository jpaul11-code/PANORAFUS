name: Publish npm Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      - name: Check if package version already exists
        id: check_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          set +e
          OUTPUT=$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry=https://npm.pkg.github.com 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUTPUT" | grep -qi 'E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$OUTPUT"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack package
        id: pack
        if: steps.check_version.outputs.exists == 'false'
        run: |
          TARBALL=$(npm pack --json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); console.log(JSON.parse(d)[0].filename)")
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
      - name: Publish package
        run: npm publish "${{ steps.pack.outputs.tarball }}"
        if: steps.check_version.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        if: steps.check_version.outputs.exists == 'false'
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
