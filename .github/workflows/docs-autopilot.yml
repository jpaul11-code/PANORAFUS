name: PANORAFUS.AI Docs Autopilot

on:
  push:
    paths:
      - "**/*.md"
      - "GLOBALNETWORK"
      - "scripts/validate-docs.sh"
      - "package.json"
      - ".github/workflows/docs-autopilot.yml"
      - ".github/workflows/robotic-services.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "GLOBALNETWORK"
      - "scripts/validate-docs.sh"
      - "package.json"
      - ".github/workflows/docs-autopilot.yml"
      - ".github/workflows/robotic-services.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PANORAFUS.AI documentation guardrails
        shell: bash
        run: |
          bash scripts/validate-docs.sh
