name: PANORAFUS.AI Content Syndication

on:
  push:
    paths:
      - "**/*.md"
      - "GLOBALNETWORK"
      - "src/**/*.js"
      - "scripts/**/*.js"
      - "package.json"
      - ".github/workflows/content-syndication.yml"
      - ".github/workflows/mdbook.yml"
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-platform-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate dashboard, API snapshots, and syndication feeds
        run: npm run platform:generate

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panorafus-platform-artifacts
          path: |
            PANORAFUS_DASHBOARD.md
            public/api
            public/syndication

      - name: Commit and push artifact updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PANORAFUS_DASHBOARD.md public/api public/syndication
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh PANORAFUS.AI platform artifacts [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
