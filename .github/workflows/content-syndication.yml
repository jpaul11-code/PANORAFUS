name: PANORAFUS.AI Content Syndication

on:
  push:
    paths:
      - "**/*.md"
      - "GLOBALNETWORK"
      - "src/**/*.js"
      - "scripts/**/*.js"
      - "package.json"
      - ".github/workflows/content-syndication.yml"
      - ".github/workflows/mdbook.yml"
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-platform-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate dashboard, API snapshots, and syndication feeds
        run: npm run platform:generate

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panorafus-platform-artifacts
          path: |
            PANORAFUS_DASHBOARD.md
            public/api
            public/syndication

      - name: Create artifact refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/panorafus-platform-artifacts
          commit-message: "chore: refresh PANORAFUS.AI platform artifacts"
          title: "chore: refresh PANORAFUS.AI platform artifacts"
          body: |
            ## Summary

            Refresh generated PANORAFUS.AI dashboard metrics, API snapshots, and syndication feeds.

            ## Scope

            - [x] Documentation architecture (`README.md`, `SUMMARY.md`, language books, indexes)
            - [x] Automation (`.github/workflows/*.yml`, scripts)
            - [ ] Repository standards (`CONTRIBUTE.md`, `SECURITY.md`, templates)
            - [x] Package/project metadata (`package.json`, release/publish setup)

            ## Acceptance Criteria

            - [x] PANORAFUS.AI branding check passes
            - [x] Internal documentation links resolve
            - [x] Language parity check passes (ar/es/fr/pt canonical file set)
            - [x] `npm test` passes
            - [x] Changes stay within declared file scope

            ## Phase Alignment

            - [ ] Phase 1: Baseline consistency and quality gates
            - [x] Phase 2: Stronger CI signal and docs governance
            - [x] Phase 3: Release/publishing discipline and observability

            ## Notes

            Generated automatically by the PANORAFUS.AI Content Syndication workflow.
          delete-branch: true
