    "/notifications/stream": {
      "get": {"operationId": "streamNotifications", "summary": "Stream own notifications over SSE", "description": "Authenticated, owner-only SSE. Use streaming fetch with an Authorization bearer header and parse SSE frames; native EventSource cannot send this header. Never pass tokens in query parameters: this endpoint rejects all query parameters. Frames contain id (notification UUID), event: notification and data containing a JSON Notification. Comment frames (: heartbeat) keep the connection alive. Last-Event-ID resumes after a notification owned by this user. Without it, existing notifications are replayed in creation-time/ID order. Connection closes on token expiry, revocation or suspension; refresh via the normal JSON endpoint, then reconnect with the new access token and last processed ID. Once streaming starts, failures close the connection rather than return a JSON error.", "parameters": [{"$ref": "#/components/parameters/LastEventId"}], "responses": {"200": {"description": "Continuous SSE frames. Notification data conforms to Notification.", "headers": {"Cache-Control": {"schema": {"type": "string", "example": "no-cache, no-transform"}}, "X-Accel-Buffering": {"schema": {"type": "string", "example": "no"}}}, "content": {"text/event-stream": {"schema": {"type": "string", "description": "SSE UTF-8 frames; data is JSON-serialized Notification."}, "example": "id: 123e4567-e89b-42d3-a456-426614174000\nevent: notification\ndata: {\"id\":\"123e4567-e89b-42d3-a456-426614174000\",\"type\":\"study_reminder\",\"title\":\"Continue your study\",\"body\":\"A lesson is waiting.\",\"is_read\":false}\n\n: heartbeat\n\n"}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
