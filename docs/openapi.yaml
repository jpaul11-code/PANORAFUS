{
  "openapi": "3.0.3",
  "info": {
    "title": "PANORAFUS Scripture Learning API",
    "version": "1.0.0",
    "description": "Versioned, snake_case Scripture-learning API. All operations require a bearer access token in the Authorization header unless explicitly public. Resource IDs are UUIDs. Ownership and group membership are checked server-side; possession of an ID grants no access. Administrators alone can manage users and audit logs. List responses use items, limit and offset. Unknown request fields are rejected. This document uses JSON serialization, a valid YAML 1.2 subset."
  },
  "servers": [{"url": "/api/v1"}],
  "security": [{"bearerAuth": []}],
  "paths": {
    "/auth/register": {
      "post": {"operationId": "register", "tags": ["Authentication"], "summary": "Register an account", "description": "Public. Creates a user account and profile. Role and ownership fields cannot be supplied by clients.", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RegisterRequest"}}}}, "responses": {"201": {"description": "Account created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "415": {"$ref": "#/components/responses/UnsupportedMediaType"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/auth/login": {
      "post": {"operationId": "login", "tags": ["Authentication"], "summary": "Sign in", "description": "Public. Returns a short-lived access JWT and an opaque refresh token. Invalid credentials receive a generic error.", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}}, "responses": {"200": {"description": "Authenticated.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "415": {"$ref": "#/components/responses/UnsupportedMediaType"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/auth/refresh": {
      "post": {"operationId": "refreshTokens", "tags": ["Authentication"], "summary": "Rotate refresh credentials", "description": "Public bearer-token exception, but a valid refresh_token JSON body is mandatory. Refresh tokens rotate; reuse revokes the token family.", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RefreshRequest"}}}}, "responses": {"200": {"description": "Replacement access and refresh credentials.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "415": {"$ref": "#/components/responses/UnsupportedMediaType"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/auth/logout": {
      "post": {"operationId": "logout", "tags": ["Authentication"], "summary": "Revoke account credentials", "description": "A valid access JWT is mandatory; logout is not public. The supplied refresh_token must belong to the authenticated account. Success revokes the account's refresh tokens and access-token version. If access has expired or logout returns 401, first call the public refresh endpoint with the refresh_token, then retry logout using BOTH the replacement access JWT in Authorization and the newly rotated refresh_token in the JSON body. Always clear local credentials on sign-out; a pending refresh must never restore local signed-in state. If refresh fails, clear local credentials without retrying an unauthenticated logout.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RefreshRequest"}}}}, "responses": {"204": {"description": "Account credentials revoked. No response body."}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "415": {"$ref": "#/components/responses/UnsupportedMediaType"}, "422": {"$ref": "#/components/responses/UnprocessableEntity"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/languages": {
      "get": {"operationId": "listLanguages", "summary": "List active languages", "security": [], "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "Active languages.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LanguagePage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createLanguage", "summary": "Create a language", "description": "Administrator only. The code is canonicalized as a BCP 47 tag; code must be unique.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LanguageCreate"}}}}, "responses": {"201": {"description": "Language created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Language"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/bible/books": {
      "get": {"operationId": "listBibleBooks", "summary": "List Bible books", "security": [], "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "Bible book page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BibleBookPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/bible/books/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getBibleBook", "summary": "Get a Bible book", "security": [], "responses": {"200": {"description": "Bible book.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BibleBook"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/bible/passages": {
      "get": {"operationId": "listBiblePassages", "summary": "List licensed Bible passages", "description": "Optional verse selects passages whose inclusive verse_start..verse_end range contains that verse. Combine book_id, chapter and verse to locate a Scripture reference.", "security": [], "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}, {"$ref": "#/components/parameters/BookFilter"}, {"$ref": "#/components/parameters/ChapterFilter"}, {"$ref": "#/components/parameters/VerseFilter"}, {"$ref": "#/components/parameters/LanguageFilter"}, {"$ref": "#/components/parameters/TranslationFilter"}], "responses": {"200": {"description": "Passages with license and source attribution.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BiblePassagePage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/bible/passages/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getBiblePassage", "summary": "Get a licensed Bible passage", "security": [], "responses": {"200": {"description": "Passage with license and source attribution.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BiblePassage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/bible/search": {
      "get": {"operationId": "searchBible", "summary": "Search passage text", "description": "Public, case-insensitive substring search of licensed passage text.", "security": [], "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}, {"$ref": "#/components/parameters/SearchQuery"}, {"$ref": "#/components/parameters/LanguageFilter"}], "responses": {"200": {"description": "Matching passage page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BiblePassagePage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/users/me": {
      "get": {"operationId": "getCurrentUser", "summary": "Get the signed-in account and profile", "responses": {"200": {"description": "Own account.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "patch": {"operationId": "updateCurrentUser", "summary": "Update own profile", "description": "Owner only. Cannot change role, status, credentials or another user's profile.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileUpdate"}}}}, "responses": {"200": {"description": "Updated own account and profile.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/users/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getPublicProfile", "summary": "Read a public profile", "description": "Requires authentication. Only active users who opt into a public profile are visible. Private account fields are not returned.", "responses": {"200": {"description": "Public profile.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublicUser"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/study-plans": {
      "get": {"operationId": "listStudyPlans", "summary": "List accessible study plans", "description": "Published plans and caller-owned drafts; administrators can see all plans.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}, {"$ref": "#/components/parameters/LanguageFilter"}, {"$ref": "#/components/parameters/ReadingLevelFilter"}], "responses": {"200": {"description": "Accessible study-plan page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyPlanPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createStudyPlan", "summary": "Create a study plan", "description": "Leader, pastor or administrator only. created_by is set to the authenticated user.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyPlanCreate"}}}}, "responses": {"201": {"description": "Study plan created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyPlan"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/study-plans/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getStudyPlan", "summary": "Get an accessible study plan", "description": "Published plan, owner or administrator only.", "responses": {"200": {"description": "Study plan.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyPlan"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "patch": {"operationId": "updateStudyPlan", "summary": "Update a study plan", "description": "Plan owner or administrator only.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyPlanUpdate"}}}}, "responses": {"200": {"description": "Updated study plan.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyPlan"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "delete": {"operationId": "deleteStudyPlan", "summary": "Delete a study plan", "description": "Plan owner or administrator only. Existing references may prevent deletion.", "responses": {"204": {"description": "Deleted. No response body."}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/study-plans/{id}/lessons": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "listPlanLessons", "summary": "List lessons in an accessible plan", "description": "Access to the parent plan is required.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "Lesson page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLessonPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createPlanLesson", "summary": "Create a lesson in a plan", "description": "Parent-plan owner or administrator only. Position is unique within the plan.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLessonCreate"}}}}, "responses": {"201": {"description": "Lesson created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLesson"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/lessons": {
      "get": {"operationId": "listLessons", "summary": "List lessons by plan", "description": "plan_id is required and the caller must be allowed to read that plan.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}, {"$ref": "#/components/parameters/PlanFilter"}], "responses": {"200": {"description": "Lesson page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLessonPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createLesson", "summary": "Create a lesson with a plan ID", "description": "Parent-plan owner or administrator only.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StandaloneLessonCreate"}}}}, "responses": {"201": {"description": "Lesson created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLesson"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/lessons/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getLesson", "summary": "Get an accessible lesson", "description": "Access to the parent plan is required.", "responses": {"200": {"description": "Lesson.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLesson"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "patch": {"operationId": "updateLesson", "summary": "Update a lesson", "description": "Parent-plan owner or administrator only.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLessonUpdate"}}}}, "responses": {"200": {"description": "Updated lesson.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudyLesson"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "delete": {"operationId": "deleteLesson", "summary": "Delete a lesson", "description": "Parent-plan owner or administrator only.", "responses": {"204": {"description": "Deleted. No response body."}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/lessons/{id}/questions": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "listLessonQuestions", "summary": "List questions for an accessible lesson", "description": "Access to the parent lesson and plan is required.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "Question page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuestionPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/questions": {
      "get": {"operationId": "listQuestions", "summary": "List own questions or questions in a lesson", "description": "Without lesson_id returns caller-created questions. With lesson_id requires parent lesson access.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}, {"$ref": "#/components/parameters/LessonFilter"}], "responses": {"200": {"description": "Question page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuestionPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createQuestion", "summary": "Create a question", "description": "created_by is the caller. Attaching to a lesson requires parent-plan write access; passage_id must exist.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuestionCreate"}}}}, "responses": {"201": {"description": "Question created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Question"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/questions/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getQuestion", "summary": "Get an accessible question", "description": "Lesson-backed questions require plan access. Standalone questions are visible to their owner or an administrator.", "responses": {"200": {"description": "Question.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Question"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/questions/{id}/answers": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "listQuestionAnswers", "summary": "List own answers to a question", "description": "Only caller-created answers are returned; access to the question is required.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "Own answer page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnswerPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createAnswer", "summary": "Answer an accessible question", "description": "created_by is the caller. is_accepted cannot be set by the client.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnswerCreate"}}}}, "responses": {"201": {"description": "Answer created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Answer"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/answers/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "patch": {"operationId": "updateAnswer", "summary": "Update own answer", "description": "Answer owner only, with continued access to the parent question.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnswerUpdate"}}}}, "responses": {"200": {"description": "Updated answer.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Answer"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/study-sessions": {
      "get": {"operationId": "listStudySessions", "summary": "List own study sessions", "description": "Owner only. Administrators do not bypass private-session ownership.", "parameters": [{"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "Own study-session page.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudySessionPage"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "post": {"operationId": "createStudySession", "summary": "Start a study session", "description": "Plan must be accessible, group membership is required when group_id is supplied, and current_lesson_id must belong to the plan. user_id is the caller.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudySessionCreate"}}}}, "responses": {"201": {"description": "Study session created.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudySession"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
    "/study-sessions/{id}": {
      "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
      "get": {"operationId": "getStudySession", "summary": "Get own study session", "description": "Owner only, with continued access to the referenced plan.", "responses": {"200": {"description": "Own study session.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudySession"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "500": {"$ref": "#/components/responses/InternalServerError"}}},
      "patch": {"operationId": "updateStudySession", "summary": "Update own study progress", "description": "Owner only. Cannot change plan or group. Current lesson must belong to the plan. completed_at is maintained by the server when status changes.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudySessionUpdate"}}}}, "responses": {"200": {"description": "Updated study session.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudySession"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "413": {"$ref": "#/components/responses/PayloadTooLarge"}, "500": {"$ref": "#/components/responses/InternalServerError"}}}
    },
